name: Refresh neutron data

# "workflow_dispatch" adds a manual "Run workflow" button under the
# Actions tab in GitHub — that's your team's "refresh" button.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest data
        env:
          FINAPP_USERNAME: ${{ secrets.FINAPP_USERNAME }}
          FINAPP_PASSWORD: ${{ secrets.FINAPP_PASSWORD }}
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --quiet --cached || git commit -m "Refresh neutron data"
          git push
