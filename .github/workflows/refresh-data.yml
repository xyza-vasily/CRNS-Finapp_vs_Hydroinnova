name: Refresh neutron data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  refresh:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Use 3.11 instead of 3.12 for better compatibility
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
        
      - name: Run data fetch
        env:
          FINAPP_USERNAME: ${{ secrets.FINAPP_USERNAME }}
          FINAPP_PASSWORD: ${{ secrets.FINAPP_PASSWORD }}
          PYTHONUNBUFFERED: 1
        continue-on-error: true  # Don't fail the workflow if Python script has issues
        run: |
          python scripts/fetch_data.py
          
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update data $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
